<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mijn Schooldag Assistent</title>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#f4f7fb;
    color:#333;
    padding-bottom:90px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.hero{
    text-align:center;
}

.hero h1{
    color:#1e40af;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:20px;
    background:#dbeafe;
    color:#1e40af;
    margin-top:10px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card:hover{
    transform:translateY(-3px);
}

.panel{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#1d4ed8;
}

.secondary{
    background:#64748b;
}

.success{
    background:#16a34a;
}

.warning{
    background:#dc2626;
}

.word{
    color:#2563eb;
    font-weight:bold;
    cursor:pointer;
}

#cameraPreview{
    width:100%;
    max-height:450px;
    border-radius:12px;
    background:black;
    display:none;
    margin-top:15px;
}

#status{
    margin-top:15px;
    font-weight:bold;
}

#result{
    margin-top:20px;
    line-height:2;
}

#definitionBox{
    margin-top:20px;
    background:#eef6ff;
    border-radius:12px;
    padding:15px;
}

.saved-item{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    background:white;
    border-top:1px solid #ddd;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav button{
    flex:1;
    background:none;
    border:none;
    color:#64748b;
    padding:12px;
}

.bottom-nav button.active{
    color:#2563eb;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<!-- HOME -->

<div id="tab-home" class="tab-content active">

<div class="hero">

<h1>🎓 Mijn Schooldag Assistent</h1>

<p>
Maak een foto van een opdracht en krijg uitleg.
</p>

<div class="badge">
NT2 • VMBO • ISK • MBO
</div>

</div>

<div class="cards">

<div class="card" onclick="toonTab('foto')">
<h2>📷</h2>
Foto maken
</div>

<div class="card" onclick="toonTab('woorden')">
<h2>⭐</h2>
Mijn woorden
</div>

</div>

</div>

<!-- FOTO -->

<div id="tab-foto" class="tab-content">

<div class="panel">

<h2>📷 Opdracht analyseren</h2>

<button onclick="startCamera()">
📷 Camera starten
</button>

<button onclick="capturePhoto()">
📸 Foto maken
</button>

<button onclick="stopCamera()">
❌ Sluiten
</button>

<button onclick="openBestand()">
📁 Bestand kiezen
</button>

<button onclick="startOCR()">
🔍 OCR starten
</button>

<input
type="file"
id="imageInput"
accept="image/*"
style="display:none;">

<video
id="cameraPreview"
autoplay
playsinline
muted>
</video>

<canvas
id="snapshotCanvas"
style="display:none;">
</canvas>

<div id="status"></div>

<progress
id="ocrProgress"
max="100"
value="0"
style="width:100%;display:none;">
</progress>

<div id="result"></div>

<div id="definitionBox"></div>

</div>

</div>

<!-- WOORDEN -->

<div id="tab-woorden" class="tab-content">

<div class="panel">

<h2>⭐ Mijn woorden</h2>

<div id="savedWordsList"></div>

</div>

</div>

<!-- INFO -->

<div id="tab-info" class="tab-content">

<div class="panel">

<h2>ℹ️ Over deze app</h2>

<p>
Help voor NT2-leerlingen.
</p>

<p>
Gegevens blijven lokaal bewaard.
</p>

</div>

</div>

</div>

<nav class="bottom-nav">

<button
id="nav-home"
class="active"
onclick="toonTab('home')">
🏠
</button>

<button
id="nav-foto"
onclick="toonTab('foto')">
📷
</button>

<button
id="nav-woorden"
onclick="toonTab('woorden')">
⭐
</button>

<button
id="nav-info"
onclick="toonTab('info')">
ℹ️
</button>

</nav>

<script>

const woordenlijst = {

oppervlakte:"Hoeveel ruimte iets inneemt.",
rechthoek:"Een figuur met vier rechte hoeken.",
percentage:"Een deel van honderd.",
grafiek:"Een afbeelding met gegevens.",
energie:"Kracht om iets te laten werken.",
omtrek:"Lengte rondom een figuur.",
inhoud:"Hoeveel ergens in past.",
temperatuur:"Hoe warm of koud iets is.",
ecosysteem:"Planten, dieren en omgeving samen."

};

function toonTab(tab){

document
.querySelectorAll(".tab-content")
.forEach(el=>el.classList.remove("active"));

document
.querySelectorAll(".bottom-nav button")
.forEach(el=>el.classList.remove("active"));

document
.getElementById("tab-"+tab)
.classList.add("active");

document
.getElementById("nav-"+tab)
.classList.add("active");

}

let currentStream=null;
let capturedImage=null;

async function startCamera(){

try{

const video =
document.getElementById(
"cameraPreview");

currentStream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},
audio:false

});

video.srcObject =
currentStream;

video.style.display="block";

}
catch(e){

alert("Camera niet beschikbaar");

}

}

function stopCamera(){

if(currentStream){

currentStream
.getTracks()
.forEach(track=>track.stop());

}

document
.getElementById("cameraPreview")
.style.display="none";

}

function capturePhoto(){

const video =
document.getElementById(
"cameraPreview"
);

const canvas =
document.getElementById(
"snapshotCanvas"
);

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

capturedImage =
canvas;

document
.getElementById("status")
.innerHTML =
"✅ Foto gemaakt";

}

function openBestand(){

document
.getElementById("imageInput")
.click();

}

async function startOCR(){

let afbeelding = null;

if(capturedImage){

afbeelding =
capturedImage;

}else{

afbeelding =
document
.getElementById(
"imageInput"
)
.files[0];

}

if(!afbeelding){

alert(
"Maak eerst een foto."
);

return;

}

document
.getElementById("ocrProgress")
.style.display =
"block";

const result =
await Tesseract.recognize(

afbeelding,

"nld",

{
logger:m=>{

if(typeof m.progress !==
"undefined"){

document
.getElementById(
"ocrProgress"
)
.value =
m.progress*100;

}

}
}

);

toonTekst(
result.data.text
);

document
.getElementById("status")
.innerHTML =
"✅ OCR voltooid";

}

function toonTekst(text){

const woorden =
text.split(/\s+/);

let html = "";

woorden.forEach(word=>{

const clean =
word
.toLowerCase()
.replace(/[.,!?;:()"']/g,"");

if(
woordenlijst[clean]
){

html +=

`<span
class="word"
onclick="toonBetekenis('${clean}')">

${word}

</span> `;

}else{

html +=
word + " ";

}

});

document
.getElementById(
"result"
)
.innerHTML =
html;

}

function toonBetekenis(woord){
