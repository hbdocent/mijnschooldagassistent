<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn Schooldag Assistent 4.0</title><script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f5f7fb;padding-bottom:70px}.container{max-width:1200px;margin:auto;padding:16px}.tab{display:none}.active{display:block}.panel,.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd}.bottom button{flex:1;border:none;background:none;padding:12px}.word{color:#2563eb;font-weight:bold;cursor:pointer}.search,.filter{width:100%;padding:12px;margin:6px 0}.flash{font-size:24px;text-align:center;padding:20px}.dark{background:#111;color:#eee}.dark .panel,.dark .card{background:#222;color:#eee}</style></head><body><div class="container"><div id="home" class="tab active"><div class="panel"><h1>🎓 Mijn Schooldag Assistent 4.0</h1><p>OCR • NT2 Woordenboek • Vertalingen • Flashcards</p><button onclick="toggleDark()">🌙 Donkere modus</button></div></div><div id="scan" class="tab"><div class="panel"><input id="imageInput" type="file" accept="image/*,.pdf"><button onclick="startOCR()">OCR starten</button><progress id="prog" max="100" value="0" style="width:100%"></progress><div id="ocrText"></div><div id="woordInfo"></div></div></div><div id="woorden" class="tab"><div class="panel"><input id="zoek" class="search" placeholder="Zoek woord" oninput="zoekWoorden()"><select id="cat" class="filter" onchange="zoekWoorden()"><option value=''>Alle categorieën</option><option>Wiskunde</option><option>Biologie</option><option>Techniek</option><option>Algemeen</option></select><div id="lijst"></div></div></div><div id="flashcards" class="tab"><div class="panel"><div id="flash" class="flash">Klik op volgende kaart</div><button onclick="volgendeKaart()">Volgende kaart</button></div></div></div><div class="bottom"><button onclick="showTab('home')">🏠</button><button onclick="showTab('scan')">📷</button><button onclick="showTab('woorden')">📚</button><button onclick="showTab('flashcards')">🃏</button></div><script>const woorden={oppervlakte:{cat:'Wiskunde',nl:'Hoeveel ruimte iets inneemt',ar:'المساحة'},rechthoek:{cat:'Wiskunde',nl:'Vorm met vier rechte hoeken',ar:'مستطيل'},percentage:{cat:'Wiskunde',nl:'Een deel van honderd',ar:'النسبة المئوية'},hart:{cat:'Biologie',nl:'Pompt bloed rond',ar:'القلب'},cel:{cat:'Biologie',nl:'Kleinste bouwsteen van een organisme',ar:'خلية'},stroomkring:{cat:'Techniek',nl:'Pad waar stroom doorheen loopt',ar:'دائرة كهربائية'},energie:{cat:'Algemeen',nl:'Kracht om iets te laten werken',ar:'طاقة'}};function showTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active')}async function startOCR(){let f=imageInput.files[0];if(!f)return;woordInfo.innerHTML='';let r=await Tesseract.recognize(f,'nld',{logger:m=>{if(m.progress)prog.value=m.progress*100}});let txt=r.data.text;ocrText.innerHTML=txt;for(let w in woorden){if(txt.toLowerCase().includes(w)){woordInfo.innerHTML+=`<div class=panel><b>${w}</b><br>${woorden[w].nl}<br><span dir='rtl'>${woorden[w].ar}</span></div>`;}}}function zoekWoorden(){let z=zoek.value.toLowerCase(),c=cat.value,h='';for(let w in woorden){let d=woorden[w];if((!z||w.includes(z))&&(!c||d.cat===c)){h+=`<div class='card'><b>${w}</b><br>${d.nl}<br><span dir='rtl'>${d.ar}</span><br><small>${d.cat}</small></div>`}}lijst.innerHTML=h}let kaarten=Object.keys(woorden),idx=0;function volgendeKaart(){let w=kaarten[idx%kaarten.length];flash.innerHTML='<b>'+w+'</b><br>'+woorden[w].nl+'<br><span dir="rtl">'+woorden[w].ar+'</span>';idx++;}function toggleDark(){document.body.classList.toggle('dark')}zoekWoorden();</script></body></html>
